name: daily-stock-report

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 07:00 JST（UTC 22:00）
  workflow_dispatch: {}      # 手動実行ボタン

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send daily report
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TOP_THEMES: "6"        # 今日の注目テーマを何件取得するか
          STOCKS_PER_THEME: "15" # 各テーマから最大何銘柄
          REPORT_TOP_N: "10"     # メールに載せる買い場銘柄の上限
        run: python daily_report.py

      - name: 実行ログ・推薦履歴を記録
        if: always()
        run: |
          if [ -n "$(git status --porcelain history/ 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add history/
            git commit -m "実行ログ・推薦履歴を更新 $(TZ=Asia/Tokyo date +%Y-%m-%d) [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
